version: '3.9'

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: jcscantoconnect
    ports:
      - '5432:5432'
    volumes:
      - jcscantoconnect_db_data:/var/lib/postgresql/data

  api:
    build: .
    restart: unless-stopped
    depends_on:
      - db
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/jcscantoconnect?schema=public
    ports:
      - '4000:4000'
    # Dockerfile's CMD already runs `prisma migrate deploy` before booting.

volumes:
  jcscantoconnect_db_data:
